name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-sidecar:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            python: '3.12'
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            python: '3.12'

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install ffmpeg (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install ffmpeg

      - name: Install ffmpeg (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install ffmpeg -y

      - name: Install Python dependencies
        working-directory: sidecar
        run: |
          python -m pip install --upgrade pip
          pip install setuptools==70.0.0
          pip install "markitdown[all] @ git+https://github.com/microsoft/markitdown.git#subdirectory=packages/markitdown"
          pip install -r requirements.txt

      # Tests del sidecar (despachador, protocolo, hook de Whisper) antes de compilar.
      - name: Test sidecar
        working-directory: sidecar
        run: |
          pip install pytest reportlab  # reportlab genera los PDFs de prueba (tests/make_fixtures.py)
          python fetch_ocr_models.py
          python -m pytest tests -q

      - name: Build sidecar
        working-directory: sidecar
        run: python build.py

      # Presupuesto de arranque: la 2ª ejecución del sidecar debe responder en <= 3 s.
      # Falla el job (y por tanto el release) si el binario no arranca, ensucia stdout o no convierte.
      - name: Smoke test sidecar
        working-directory: sidecar
        run: python smoke_test.py --max-seconds 3

      # tar conserva el bit de ejecución y los symlinks que upload-artifact descarta.
      - name: Pack sidecar
        shell: bash
        run: |
          tar -cf "sidecar-${{ matrix.target }}.tar" -C src-tauri/binaries markify-sidecar
          ls -lh "sidecar-${{ matrix.target }}.tar"
          du -sh src-tauri/binaries/markify-sidecar

      - name: Upload sidecar
        uses: actions/upload-artifact@v4
        with:
          name: sidecar-${{ matrix.target }}
          path: sidecar-${{ matrix.target }}.tar
          retention-days: 1

  build-app:
    needs: build-sidecar
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Download sidecar
        uses: actions/download-artifact@v4
        with:
          name: sidecar-${{ matrix.target }}
          path: sidecar-artifact

      - name: Extract sidecar
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          tar -xpf "sidecar-artifact/sidecar-${{ matrix.target }}.tar" -C src-tauri/binaries
          ls src-tauri/binaries/markify-sidecar

      - name: Install npm dependencies
        run: npm ci

      - name: Frontend checks
        run: |
          npm run type-check
          npm test

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Markify ${{ github.ref_name }}'
          releaseBody: |
            ## Instaladores

            - **macOS** (Apple Silicon): `.dmg`
            - **Windows**: `.msi` o `.exe`
            releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
